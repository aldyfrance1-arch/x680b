name: Build TWRP for X680B

on:
  workflow_dispatch:  # Bisa manual trigger
  push:
    branches: [ twrp-12.1 ]
    paths:
      - '**'
      - '!.github/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180  # Max 3 jam
    
    steps:
    - name: Checkout device tree
      uses: actions/checkout@v4
      with:
        path: device/infinix/x680b
        ref: twrp-12.1
    
    - name: Setup Build Environment
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          git-core gnupg flex bison build-essential zip curl zlib1g-dev \
          gcc-multilib g++-multilib libc6-dev-i386 libncurses5 \
          lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
          libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
          python3 android-tools-adb bc imagemagick ccache schedtool \
          rsync libssl-dev openjdk-11-jdk repo lzop liblz4-tool \
          gperf
    
    - name: Configure Git
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"
    
    - name: Initialize Repo
      run: |
        mkdir -p ~/twrp && cd ~/twrp
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
          -b twrp-12.1 \
          --depth=1
    
    - name: Sync Source
      run: |
        cd ~/twrp
        repo sync -c -j$(nproc) \
          --force-sync \
          --no-clone-bundle \
          --no-tags \
          --optimized-fetch \
          --prune
    
    - name: Setup Device Tree
      run: |
        cd ~/twrp
        mkdir -p device/infinix
        cp -r $GITHUB_WORKSPACE/device/infinix/x680b device/infinix/x680b
        # atau jika mau clone langsung:
        # git clone https://github.com/${{ github.repository }}.git device/infinix/x680b
    
    - name: Configure Build
      run: |
        cd ~/twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        export USE_CCACHE=1
        ccache -M 15G
        
        source build/envsetup.sh
        lunch twrp_x680b-eng || lunch omni_x680b-eng
    
    - name: Start Build
      run: |
        cd ~/twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        
        # Coba build recovery
        mka recoveryimage -j$(nproc) || \
        make recoveryimage -j$(nproc) || \
        make bootimage -j$(nproc)
    
    - name: Check Build Output
      run: |
        cd ~/twrp
        echo "=== Listing output directory ==="
        find out/target/product -name "*.img" -type f 2>/dev/null || true
        find out/target/product -name "recovery*" -type f 2>/dev/null || true
    
    - name: Upload Recovery Image
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Recovery-X680B
        path: |
          ~/twrp/out/target/product/x680b/recovery.img
          ~/twrp/out/target/product/x680b/boot.img
        if-no-files-found: error
    
    - name: Upload Logs (if failed)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Logs
        path: |
          ~/twrp/out/error.log
          ~/twrp/out/build.log
        if-no-files-found: warn￼Enter
